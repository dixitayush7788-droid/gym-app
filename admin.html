<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://zfvkvrhuovvbfbrutpph.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpmdmt2cmh1b3Z2YmZicnV0cHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzIyODQsImV4cCI6MjEwMjcwODI4NH0.M-WK1bgZDLXcuMTldMSwptx5XRpRnLAi-BxMFEoph4U";
    const CORRECT_PIN = "1234";
    var db = null;
    var allMembers = [];

    function unlockApp() {
      var pin = document.getElementById("pinInput").value.trim();
      var err = document.getElementById("pinError");
      if (pin === CORRECT_PIN) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("adminContent").style.display = "block";
        initDatabase();
      } else {
        err.innerText = "Wrong PIN! Default: 1234";
        err.style.display = "block";
      }
    }

    function initDatabase() {
      try {
        if (window.supabase) {
          db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          fetchAndRender();
        }
      } catch (e) {
        console.log("DB Error: ", e);
      }
    }

    async function fetchAndRender() {
      if (!db) return;
      const { data, error } = await db.from('members').select('*').order('created_at', { ascending: false });
      if (error || !data) return;
      allMembers = data;

      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      let active = 0, expired = 0, revenue = 0, expiringSoonList = [];

      data.forEach(m => {
        revenue += (m.fees_paid || 0);
        const exp = new Date(m.expiry_date);
        const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));

        if (diffDays >= 0) active++;
        else expired++;

        if (diffDays >= 0 && diffDays <= 3) {
          expiringSoonList.push({ ...m, diffDays });
        }
      });

      document.getElementById("statTotal").innerText = data.length;
      document.getElementById("statActive").innerText = active;
      document.getElementById("statExpired").innerText = expired;
      document.getElementById("statRevenue").innerText = "₹" + revenue;

      renderExpiring(expiringSoonList);
      renderLeaderboard(data);
      renderMemberList(data);
    }

    function renderExpiring(list) {
      const container = document.getElementById("expiringList");
      if (list.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 italic">No plans expiring in next 3 days.</p>`;
        return;
      }
      container.innerHTML = list.map(m => `
        <div class="flex justify-between items-center bg-gray-800/60 border border-amber-500/30 p-3 rounded-xl text-xs mb-2">
          <div>
            <p class="font-bold text-white">${m.full_name}</p>
            <p class="text-amber-400 text-[10px]">Expires in ${m.diffDays} day(s) (${m.expiry_date})</p>
          </div>
          <a href="https://wa.me/91${m.phone}?text=Hello%20${encodeURIComponent(m.full_name)},%20aapka%20Gym%20membership%20${m.diffDays}%20din%20me%20expire%20ho%20raha%20hai.%20Kripya%20time%20par%20renew%20karein!" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-3 py-1.5 rounded-lg text-white">📲 WhatsApp</a>
        </div>
      `).join('');
    }

    function renderLeaderboard(data) {
      const top = [...data].sort((a, b) => (b.streak_count || 0) - (a.streak_count || 0)).slice(0, 3);
      document.getElementById("leaderboardList").innerHTML = top.map((m, idx) => `
        <div class="flex justify-between items-center bg-gray-800/40 p-2.5 rounded-xl text-xs mb-1.5">
          <div class="flex items-center gap-2">
            <span class="font-black text-amber-400">#${idx + 1}</span>
            <span class="font-bold text-white">${m.full_name}</span>
          </div>
          <span class="font-bold text-emerald-400">🔥 ${m.streak_count || 0} Days</span>
        </div>
      `).join('');
    }

    function renderMemberList(data) {
      document.getElementById("memberTable").innerHTML = data.map(m => `
        <div class="bg-gray-800/40 border border-gray-800 p-3 rounded-xl mb-2 text-xs flex justify-between items-center">
          <div>
            <p class="font-bold text-white">${m.full_name} <span class="text-gray-500 font-normal">(${m.phone})</span></p>
            <p class="text-gray-400 text-[10px]">Expires: ${m.expiry_date} | ₹${m.fees_paid || 0}</p>
          </div>
          <button onclick="renewMember('${m.id}', '${m.expiry_date}')" class="bg-blue-600 hover:bg-blue-500 text-[10px] font-bold px-2.5 py-1.5 rounded-lg text-white">+1 Month</button>
        </div>
      `).join('');
    }

    async function renewMember(id, currentExpiry) {
      if (!confirm("Renew membership for +1 Month?")) return;
      var cur = new Date(currentExpiry);
      var today = new Date();
      var base = cur > today ? cur : today;
      base.setMonth(base.getMonth() + 1);
      var newDate = base.toISOString().split('T')[0];

      await db.from('members').update({ expiry_date: newDate }).eq('id', id);
      fetchAndRender();
    }

    async function registerMember() {
      var name = document.getElementById("formName").value.trim();
      var phone = document.getElementById("formPhone").value.trim();
      var months = parseInt(document.getElementById("formPlan").value);
      var fees = parseFloat(document.getElementById("formFees").value);
      var status = document.getElementById("formStatus");
      var btn = document.getElementById("saveBtn");

      if (!name || !phone || isNaN(fees)) {
        alert("Kripya saari details bharein!");
        return;
      }

      btn.innerText = "Saving...";
      btn.disabled = true;
      status.style.display = "none";

      var exp = new Date();
      exp.setMonth(exp.getMonth() + months);
      var expiryDate = exp.toISOString().split('T')[0];

      const { error } = await db.from('members').insert([{
        full_name: name,
        phone: phone,
        plan_duration_months: months,
        expiry_date: expiryDate,
        fees_paid: fees
      }]);

      btn.innerText = "Save & Register Member";
      btn.disabled = false;

      if (error) {
        status.innerText = "❌ Error: " + error.message;
        status.className = "text-xs text-center mt-3 text-rose-400 block font-bold";
        status.style.display = "block";
      } else {
        status.innerText = "✅ Member Registered Successfully!";
        status.className = "text-xs text-center mt-3 text-emerald-400 block font-bold";
        status.style.display = "block";
        document.getElementById("formName").value = "";
        document.getElementById("formPhone").value = "";
        document.getElementById("formFees").value = "";
        fetchAndRender();
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 pb-20 font-sans">

  <!-- Lock Screen -->
  <div id="lockScreen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center p-6 z-50">
    <div class="w-full max-w-xs bg-gray-900 border border-gray-800 rounded-3xl p-6 text-center shadow-2xl">
      <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">🔒</div>
      <h2 class="text-lg font-bold text-white">Admin Command</h2>
      <p class="text-xs text-gray-400 mt-1 mb-4">PIN: <span class="text-emerald-400 font-bold">1234</span></p>
      <input id="pinInput" type="number" pattern="[0-9]*" inputmode="numeric" placeholder="Enter PIN" class="w-full bg-gray-800 text-center tracking-widest text-xl py-3 rounded-xl border border-gray-700 focus:outline-none focus:border-emerald-500 mb-4 text-white" />
      <button type="button" onclick="unlockApp()" class="w-full bg-emerald-500 active:scale-95 font-bold py-3.5 rounded-xl transition-all text-white shadow-lg shadow-emerald-500/20">Unlock Dashboard</button>
      <p id="pinError" style="display:none;" class="text-rose-400 text-xs mt-3"></p>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminContent" style="display:none;" class="max-w-md mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-xl font-black text-white">⚡ GYM COMMAND</h1>
        <p class="text-xs text-gray-400">Admin Control Center</p>
      </div>
      <button type="button" onclick="location.reload()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3.5 py-2 rounded-xl border border-gray-700 text-gray-300 font-medium">🔒 Lock</button>
    </div>

    <!-- Analytics Stats -->
    <div class="grid grid-cols-4 gap-2 mb-6 text-center">
      <div class="bg-gray-900 border border-gray-800 p-2.5 rounded-2xl">
        <p class="text-[9px] text-gray-400 uppercase font-semibold">Total</p>
        <p id="statTotal" class="text-base font-black text-white mt-1">0</p>
      </div>
      <div class="bg-gray-900 border border-emerald-900/40 p-2.5 rounded-2xl">
        <p class="text-[9px] text-emerald-400 uppercase font-semibold">Active</p>
        <p id="statActive" class="text-base font-black text-emerald-400 mt-1">0</p>
      </div>
      <div class="bg-gray-900 border border-rose-900/40 p-2.5 rounded-2xl">
        <p class="text-[9px] text-rose-400 uppercase font-semibold">Expired</p>
        <p id="statExpired" class="text-base font-black text-rose-400 mt-1">0</p>
      </div>
      <div class="bg-gray-900 border border-amber-900/40 p-2.5 rounded-2xl">
        <p class="text-[9px] text-amber-400 uppercase font-semibold">Revenue</p>
        <p id="statRevenue" class="text-base font-black text-amber-400 mt-1">₹0</p>
      </div>
    </div>

    <!-- 1-Click WhatsApp Expiry Alerts -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-lg mb-6">
      <h2 class="text-xs font-bold text-amber-400 mb-3 uppercase tracking-wider flex items-center gap-1.5">⚠️ Expiring Soon (< 3 Days)</h2>
      <div id="expiringList"></div>
    </div>

    <!-- Beast Leaderboard -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-lg mb-6">
      <h2 class="text-xs font-bold text-emerald-400 mb-3 uppercase tracking-wider flex items-center gap-1.5">🏆 Gym Beast Leaderboard</h2>
      <div id="leaderboardList"></div>
    </div>

    <!-- Add Member Form -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-lg mb-6">
      <h2 class="text-sm font-bold text-gray-200 mb-4">➕ Register New Member</h2>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-400 mb-1 font-medium">Full Name</label>
          <input id="formName" type="text" placeholder="e.g. Rahul Sharma" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-gray-400 mb-1 font-medium">Mobile Number</label>
          <input id="formPhone" type="tel" placeholder="10-digit phone number" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-400 mb-1 font-medium">Plan</label>
            <select id="formPlan" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
              <option value="1">1 Month</option>
              <option value="3">3 Months</option>
              <option value="6">6 Months</option>
              <option value="12">12 Months</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-400 mb-1 font-medium">Fees Paid (₹)</label>
            <input id="formFees" type="number" placeholder="1000" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
        <button id="saveBtn" type="button" onclick="registerMember()" class="w-full bg-emerald-500 active:scale-98 font-bold text-white py-3.5 rounded-xl transition-all mt-2 text-sm shadow-lg shadow-emerald-500/20">Save & Register Member</button>
      </div>
      <p id="formStatus" style="display:none;"></p>
    </div>

    <!-- Member Directory -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-lg">
      <h2 class="text-sm font-bold text-gray-200 mb-3">📋 All Members Directory</h2>
      <div id="memberTable"></div>
    </div>
  </div>

</body>
</html>
