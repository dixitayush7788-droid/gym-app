<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script>
    const SUPABASE_URL = "https://zfvkvrhuovvbfbrutpph.supabase.co";
    // Fixed lowercase 'e' key
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpmdmt2cmh1b3Z2YmZicnV0cHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzIyODQsImV4cCI6MjEwMjcwODI4NH0.M-WK1bgZDLXcuMTldMSwptx5XRpRnLAi-BxMFEoph4U";
    const CORRECT_PIN = "1234";
    var db = null;

    function unlockApp() {
      var pin = document.getElementById("pinInput").value.trim();
      var err = document.getElementById("pinError");
      
      if (pin === CORRECT_PIN) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("adminContent").style.display = "block";
        initDatabase();
      } else {
        err.innerText = "Wrong PIN! Enter 1234";
        err.style.display = "block";
      }
    }

    function initDatabase() {
      try {
        if (window.supabase) {
          db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          refreshStats();
        }
      } catch (e) {
        console.log("DB Error: ", e);
      }
    }

    async function refreshStats() {
      if (!db) return;
      try {
        const { data, error } = await db.from('members').select('*');
        if (error || !data) return;

        const today = new Date().toISOString().split('T')[0];
        var active = 0, expired = 0;

        data.forEach(function(m) {
          if (m.expiry_date >= today) active++;
          else expired++;
        });

        document.getElementById("statTotal").innerText = data.length;
        document.getElementById("statActive").innerText = active;
        document.getElementById("statExpired").innerText = expired;
      } catch (err) {}
    }

    async function registerMember() {
      var name = document.getElementById("formName").value.trim();
      var phone = document.getElementById("formPhone").value.trim();
      var months = parseInt(document.getElementById("formPlan").value);
      var fees = parseFloat(document.getElementById("formFees").value);
      var status = document.getElementById("formStatus");
      var btn = document.getElementById("saveBtn");

      if (!name || !phone || isNaN(fees)) {
        alert("Kripya saari details bharein!");
        return;
      }

      btn.innerText = "Saving...";
      btn.disabled = true;
      status.style.display = "none";

      if (!db) initDatabase();

      var exp = new Date();
      exp.setMonth(exp.getMonth() + months);
      var expiryDate = exp.toISOString().split('T')[0];

      try {
        const { data, error } = await db.from('members').insert([{
          full_name: name,
          phone: phone,
          plan_duration_months: months,
          expiry_date: expiryDate,
          fees_paid: fees
        }]);

        btn.innerText = "Save & Register Member";
        btn.disabled = false;

        if (error) {
          status.innerText = "❌ Error: " + error.message;
          status.className = "text-xs text-center mt-3 text-rose-400 block font-bold";
          status.style.display = "block";
        } else {
          status.innerText = "✅ Member Registered Successfully!";
          status.className = "text-xs text-center mt-3 text-emerald-400 block font-bold";
          status.style.display = "block";
          document.getElementById("formName").value = "";
          document.getElementById("formPhone").value = "";
          document.getElementById("formFees").value = "";
          refreshStats();
        }
      } catch (e) {
        btn.innerText = "Save & Register Member";
        btn.disabled = false;
        alert("Connection Error: " + e.message);
      }
    }

    function startScannerNow() {
      document.getElementById("reader").style.display = "block";
      document.getElementById("startScanBtn").style.display = "none";

      var qrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
      qrScanner.render(async function(decodedText) {
        var scanStatus = document.getElementById("scanResult");
        scanStatus.innerText = "⏳ Recording Attendance...";

        if (db) {
          const { error } = await db.from('attendance').insert([{ member_id: decodedText }]);
          if (!error) {
            scanStatus.innerText = "✅ Attendance Marked!";
            scanStatus.className = "text-xs font-semibold text-center mt-3 text-emerald-400";
          } else {
            scanStatus.innerText = "❌ Scan Error: " + error.message;
            scanStatus.className = "text-xs font-semibold text-center mt-3 text-rose-400";
          }
        }
      });
    }
  </script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 pb-20 font-sans">

  <!-- 1. LOCK SCREEN -->
  <div id="lockScreen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center p-6 z-50">
    <div class="w-full max-w-xs bg-gray-900 border border-gray-800 rounded-3xl p-6 text-center shadow-2xl">
      <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">🔒</div>
      <h2 class="text-lg font-bold text-white">Admin Access</h2>
      <p class="text-xs text-gray-400 mt-1 mb-4">Default PIN: <span class="text-emerald-400 font-bold">1234</span></p>
      
      <input id="pinInput" type="number" pattern="[0-9]*" inputmode="numeric" placeholder="Enter PIN" class="w-full bg-gray-800 text-center tracking-widest text-xl py-3 rounded-xl border border-gray-700 focus:outline-none focus:border-emerald-500 mb-4 text-white placeholder-gray-500" />
      
      <button type="button" onclick="unlockApp()" class="w-full bg-emerald-500 active:scale-95 font-bold py-3.5 rounded-xl transition-all text-white shadow-lg shadow-emerald-500/20">Unlock Dashboard</button>
      
      <p id="pinError" style="display:none;" class="text-rose-400 text-xs mt-3"></p>
    </div>
  </div>

  <!-- 2. ADMIN DASHBOARD CONTENT -->
  <div id="adminContent" style="display:none;" class="max-w-md mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-xl font-black text-white">⚡ GYM ADMIN</h1>
        <p class="text-xs text-gray-400">Management & Scanner</p>
      </div>
      <button type="button" onclick="location.reload()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3.5 py-2 rounded-xl border border-gray-700 text-gray-300 font-medium">🔒 Lock</button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-2.5 mb-6">
      <div class="bg-gray-900 border border-gray-800 p-3.5 rounded-2xl text-center">
        <p class="text-[10px] text-gray-400 uppercase font-semibold">Total</p>
        <p id="statTotal" class="text-xl font-black text-white mt-1">0</p>
      </div>
      <div class="bg-gray-900 border border-emerald-900/40 p-3.5 rounded-2xl text-center">
        <p class="text-[10px] text-emerald-400 uppercase font-semibold">Active</p>
        <p id="statActive" class="text-xl font-black text-emerald-400 mt-1">0</p>
      </div>
      <div class="bg-gray-900 border border-rose-900/40 p-3.5 rounded-2xl text-center">
        <p class="text-[10px] text-rose-400 uppercase font-semibold">Expired</p>
        <p id="statExpired" class="text-xl font-black text-rose-400 mt-1">0</p>
      </div>
    </div>

    <!-- Admission Form -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-lg mb-6">
      <h2 class="text-sm font-bold text-gray-200 mb-4">➕ New Member Admission</h2>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-400 mb-1 font-medium">Member Full Name</label>
          <input id="formName" type="text" placeholder="e.g. Rohit Kumar" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-gray-400 mb-1 font-medium">Mobile Number</label>
          <input id="formPhone" type="tel" placeholder="10-digit phone number" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-400 mb-1 font-medium">Plan Type</label>
            <select id="formPlan" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
              <option value="1">1 Month</option>
              <option value="3">3 Months</option>
              <option value="6">6 Months</option>
              <option value="12">12 Months</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-400 mb-1 font-medium">Fees Paid (₹)</label>
            <input id="formFees" type="number" placeholder="1000" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
        <button id="saveBtn" type="button" onclick="registerMember()" class="w-full bg-emerald-500 active:scale-98 font-bold text-white py-3.5 rounded-xl transition-all mt-2 text-sm shadow-lg shadow-emerald-500/20">Save & Register Member</button>
      </div>
      <p id="formStatus" style="display:none;"></p>
    </div>

    <!-- Scanner -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-lg">
      <h2 class="text-sm font-bold text-gray-200 mb-3">📷 Member Attendance Scanner</h2>
      <button id="startScanBtn" type="button" onclick="startScannerNow()" class="w-full bg-gray-800 border border-gray-700 text-xs font-semibold py-3 rounded-xl mb-3 hover:bg-gray-700 text-gray-200">Start Camera Scanner</button>
      <div id="reader" style="display:none;" class="overflow-hidden rounded-2xl border border-gray-800 bg-black min-h-[220px]"></div>
      <p id="scanResult" class="text-xs font-semibold text-center mt-3 text-gray-400">Scanner ready</p>
    </div>
  </div>

</body>
</html>
