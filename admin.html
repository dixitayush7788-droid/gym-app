<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <script>
    // Bulletproof Unlock Function
    function checkPin() {
      var pin = document.getElementById("pinInput").value.trim();
      var errorEl = document.getElementById("pinError");
      
      if (pin === "1234") {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("adminContent").style.display = "block";
        if (typeof initDashboard === "function") {
          initDashboard();
        }
      } else {
        errorEl.innerText = "Wrong PIN! (Default is 1234)";
        errorEl.style.display = "block";
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 pb-20 font-sans">

  <!-- 1. Lock Screen -->
  <div id="lockScreen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center p-6 z-50">
    <div class="w-full max-w-xs bg-gray-900 border border-gray-800 rounded-3xl p-6 text-center shadow-2xl">
      <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-xl">🔒</div>
      <h2 class="text-lg font-bold text-white">Admin Access</h2>
      <p class="text-xs text-gray-400 mt-1 mb-5">Enter PIN: <b>1234</b></p>
      
      <input id="pinInput" type="number" pattern="[0-9]*" inputmode="numeric" placeholder="••••" class="w-full bg-gray-800 text-center tracking-widest text-2xl py-3 rounded-xl border border-gray-700 focus:outline-none focus:border-emerald-500 mb-4 text-white" />
      
      <button type="button" onclick="checkPin()" class="w-full bg-emerald-500 active:bg-emerald-600 hover:bg-emerald-600 font-bold py-3 rounded-xl transition-all text-white">Unlock Dashboard</button>
      
      <p id="pinError" style="display:none;" class="text-rose-400 text-xs mt-3"></p>
    </div>
  </div>

  <!-- 2. Admin Content -->
  <div id="adminContent" style="display:none;" class="max-w-md mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-xl font-black text-white">GYM ADMIN</h1>
        <p class="text-xs text-gray-400">Management & Attendance</p>
      </div>
      <button onclick="location.reload()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded-xl border border-gray-700 text-gray-300">Lock</button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-gray-900 border border-gray-800 p-3 rounded-2xl text-center">
        <p class="text-[10px] text-gray-400 uppercase font-semibold">Total</p>
        <p id="statTotal" class="text-xl font-black text-white mt-1">0</p>
      </div>
      <div class="bg-gray-900 border border-emerald-900/40 p-3 rounded-2xl text-center">
        <p class="text-[10px] text-emerald-400 uppercase font-semibold">Active</p>
        <p id="statActive" class="text-xl font-black text-emerald-400 mt-1">0</p>
      </div>
      <div class="bg-gray-900 border border-rose-900/40 p-3 rounded-2xl text-center">
        <p class="text-[10px] text-rose-400 uppercase font-semibold">Expired</p>
        <p id="statExpired" class="text-xl font-black text-rose-400 mt-1">0</p>
      </div>
    </div>

    <!-- New Admission Form -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-lg mb-6">
      <h2 class="text-sm font-bold text-gray-200 mb-4 flex items-center gap-2">➕ New Member Admission</h2>
      <form id="addMemberForm" onsubmit="handleAddMember(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">Full Name</label>
          <input id="formName" required type="text" placeholder="e.g. Rahul Sharma" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Phone Number</label>
          <input id="formPhone" required type="tel" placeholder="10-digit number" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-400 mb-1">Plan Duration</label>
            <select id="formPlan" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
              <option value="1">1 Month</option>
              <option value="3">3 Months</option>
              <option value="6">6 Months</option>
              <option value="12">1 Year</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Fees Paid (₹)</label>
            <input id="formFees" required type="number" placeholder="1000" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
        <button type="submit" class="w-full bg-emerald-500 active:bg-emerald-600 font-bold text-white py-3 rounded-xl transition-all mt-2 text-sm">Save & Register Member</button>
      </form>
      <p id="formStatus" class="text-xs text-center mt-3 hidden"></p>
    </div>

    <!-- Attendance QR Scanner -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-lg">
      <h2 class="text-sm font-bold text-gray-200 mb-3 flex items-center gap-2">📷 Attendance QR Scanner</h2>
      <button id="startScanBtn" type="button" onclick="initScanner()" class="w-full bg-gray-800 border border-gray-700 hover:bg-gray-700 text-xs font-semibold py-3 rounded-xl mb-3">Open Camera Scanner</button>
      <div id="reader" class="overflow-hidden rounded-2xl border border-gray-800 bg-black min-h-[200px] hidden"></div>
      <p id="scanResult" class="text-xs font-semibold text-center mt-3 text-gray-400">Tap above to scan member card</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zfvkvrhuovvbfbrutpph.supabase.co";
    const SUPABASE_KEY = "PASTE_YOUR_ANON_KEY_HERE"; // Apni Supabase key yahan paste karein

    var supabaseClient = null;

    function initDashboard() {
      try {
        if (window.supabase) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          loadDashboardStats();
        }
      } catch(e) {
        console.log("Supabase error:", e);
      }
    }

    async function loadDashboardStats() {
      if (!supabaseClient) return;
      try {
        const { data: members } = await supabaseClient.from('members').select('*');
        if (!members) return;

        const today = new Date().toISOString().split('T')[0];
        let active = 0, expired = 0;

        members.forEach(m => {
          if (m.expiry_date >= today) active++;
          else expired++;
        });

        document.getElementById("statTotal").innerText = members.length;
        document.getElementById("statActive").innerText = active;
        document.getElementById("statExpired").innerText = expired;
      } catch(e) {}
    }

    async function handleAddMember(e) {
      e.preventDefault();
      const status = document.getElementById("formStatus");
      const name = document.getElementById("formName").value.trim();
      const phone = document.getElementById("formPhone").value.trim();
      const months = parseInt(document.getElementById("formPlan").value);
      const fees = parseFloat(document.getElementById("formFees").value);

      const expiry = new Date();
      expiry.setMonth(expiry.getMonth() + months);
      const expiryStr = expiry.toISOString().split('T')[0];

      status.innerText = "Registering...";
      status.className = "text-xs text-center mt-3 text-yellow-400 block";

      if (!supabaseClient) {
        status.innerText = "Database connection error!";
        status.className = "text-xs text-center mt-3 text-rose-400 block";
        return;
      }

      const { error } = await supabaseClient.from('members').insert([{
        full_name: name,
        phone: phone,
        plan_duration_months: months,
        expiry_date: expiryStr,
        fees_paid: fees
      }]);

      if (error) {
        status.innerText = "Error: " + error.message;
        status.className = "text-xs text-center mt-3 text-rose-400 block";
      } else {
        status.innerText = "✅ Member Registered Successfully!";
        status.className = "text-xs text-center mt-3 text-emerald-400 block";
        document.getElementById("addMemberForm").reset();
        loadDashboardStats();
      }
    }

    function initScanner() {
      document.getElementById("reader").classList.remove("hidden");
      document.getElementById("startScanBtn").classList.add("hidden");
      
      const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
      html5QrcodeScanner.render(async (decodedText) => {
        const scanStatus = document.getElementById("scanResult");
        scanStatus.innerText = "Marking attendance...";
        
        if (supabaseClient) {
          const { error } = await supabaseClient.from('attendance').insert([{ member_id: decodedText }]);
          if (!error) {
            scanStatus.innerText = "✅ Attendance Marked!";
            scanStatus.className = "text-xs font-semibold text-center mt-3 text-emerald-400";
          } else {
            scanStatus.innerText = "❌ Scan Error";
            scanStatus.className = "text-xs font-semibold text-center mt-3 text-rose-400";
          }
        }
      });
    }
  </script>
</body>
</html>
